<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAC-MAN - Retro Arcade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%91%BB</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <div id="hud">
      <div class="hud-item">SCORE<span id="score">0</span></div>
      <div class="hud-item">HIGH<span id="highScore">0</span></div>
      <div class="hud-item">LEVEL<span id="level">1</span></div>
      <div class="hud-item">LIVES<span id="lives">●●●</span></div>
    </div>

    <canvas id="game" width="532" height="588"></canvas>

    <div id="overlay" class="screen">
      <h1 class="title" id="overlayTitle">PAC-MAN</h1>
      <p class="sub" id="overlaySub">move <b>◀ ▶ ▲ ▼</b> / <b>WASD</b> &mdash; eat every dot, dodge the ghosts, grab a power pellet to turn the tables</p>

      <div id="nameEntry" class="name-entry hidden">
        <p class="board-title">NEW TOP SCORE! ENTER YOUR NAME</p>
        <input id="nameInput" maxlength="10" autocomplete="off" spellcheck="false" placeholder="YOUR NAME">
        <button id="submitNameBtn" class="arcade-btn">SUBMIT</button>
      </div>

      <div id="leaderboard" class="leaderboard">
        <p class="board-title">TOP SCORES</p>
        <ol id="leaderboardList"></ol>
      </div>

      <button id="startBtn" class="arcade-btn">PRESS START</button>
      <p class="hint">(touch controls appear on mobile)</p>
    </div>

    <div id="touch-controls">
      <div id="dpad">
        <button id="upBtn" class="touch-btn dpad-btn dpad-up" aria-label="move up">▲</button>
        <button id="leftBtn" class="touch-btn dpad-btn dpad-left" aria-label="move left">◀</button>
        <button id="rightBtn" class="touch-btn dpad-btn dpad-right" aria-label="move right">▶</button>
        <button id="downBtn" class="touch-btn dpad-btn dpad-down" aria-label="move down">▼</button>
      </div>
    </div>
  </div>

  <a href="../index.html" class="back-link">◀ HOME</a>
  <button id="restartBtn" class="restart-link hidden" aria-label="restart run">⟲ RESTART (R)</button>

  <script src="game.js"></script>
</body>
</html>
