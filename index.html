<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADE HOME</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="sky"></div>
    <div class="sun">
      <div class="bar bar1"></div>
      <div class="bar bar2"></div>
      <div class="bar bar3"></div>
      <div class="bar bar4"></div>
      <div class="bar bar5"></div>
      <div class="bar bar6"></div>
    </div>
    <div class="horizon-glow"></div>
    <div class="mountains left"></div>
    <div class="mountains right"></div>
    <div class="ground"></div>
  </div>

  <main class="page">
    <div>
      <h1 class="brand">ARCADE HOME</h1>
      <p class="brand-sub">my games</p>
    </div>

    <div class="search-wrap">
      <span class="icon">🔍</span>
      <input id="gameSearch" type="search" placeholder="Search games..." autocomplete="off" spellcheck="false">
    </div>

    <div class="app-grid" id="appGrid"></div>
    <p class="no-results hidden" id="noResults">NO GAMES FOUND</p>
  </main>

  <script src="home.js"></script>
</body>
</html>
