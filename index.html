<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RAIDERS - Retro Space Shooter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <div id="hud">
      <div class="hud-item">SCORE<span id="score">0</span></div>
      <div class="hud-item">WAVE<span id="wave">1</span></div>
      <div class="hud-item">LIVES<span id="lives">▲▲▲</span></div>
    </div>

    <canvas id="game" width="800" height="600"></canvas>

    <div id="overlay" class="screen">
      <h1 class="title" id="overlayTitle">NEON RAIDERS</h1>
      <p class="sub" id="overlaySub">move <b>◀ ▶</b> / <b>A D</b> to aim &mdash; your ship fires automatically</p>
      <button id="startBtn" class="arcade-btn">PRESS START</button>
      <p class="hint">(touch controls appear on mobile)</p>
    </div>

    <div id="touch-controls">
      <button id="leftBtn" class="touch-btn">◀</button>
      <button id="rightBtn" class="touch-btn">▶</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
